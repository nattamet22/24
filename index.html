const others=(arr,ex,n)=>shuf([...new Set(arr)].filter(x=>x!==ex)).slice(0,n);
function numOpts(ans){
  const c=new Set();
  for(const d of shuf([1,2,3,5,10,-1,-2,-3,-5,-10])){const v=ans+(Math.abs(ans)>=50?d*Math.ceil(ans/20):d);if(v!==ans&&v>=0)c.add(v);if(c.size>=3)break}
  for(let k=1;c.size<3;k++)c.add(ans+k*7);
  return [...c].slice(0,3).map(String);

const GW={iq:.75,eng:.9,mil:.75,sub:.88};
function makeQ(cat,i){
  if(cat==='math'){const t=1+Math.min(3,Math.floor((i||0)/5));return(t>=2&&Math.random()<.2)?R(QB.math):R(MQ[t])()}
  const g=GN[cat],s=QB[cat];return(g&&g.length&&Math.random()<GW[cat])?R(g)():R(s)}

let peer=null,hostConn=null,conns=[],G=null,room=null,uid=null,isHost=false,code='',keySeen='',err='',myName='';
let QS=[],A={};
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}},del(k){try{localStorage.removeItem(k)}catch(e){}}};
let pid=store.get('g24_pid');if(!pid){pid=Math.random().toString(36).slice(2,12)+Date.now().toString(36);store.set('g24_pid',pid)}
let peerPid={},leaving=false,reconnecting=false,reTries=0,reTimer=null;
let L={tiles:[],hist:[],sel:null,op:null,msg:'',cls:'',nid:10,pick:null};

function solve(a){
  if(a.length==1)return Math.abs(a[0].v-24)<1e-6?a[0].e:null;
  for(let i=0;i<a.length;i++)for(let j=i+1;j<a.length;j++){
    const rest=a.filter((_,k)=>k!=i&&k!=j),x=a[i],y=a[j];
    const c=[[x.v+y.v,`(${x.e}+${y.e})`],[x.v*y.v,`(${x.e}×${y.e})`],[x.v-y.v,`(${x.e}−${y.e})`],[y.v-x.v,`(${y.e}−${x.e})`]];
    if(Math.abs(y.v)>1e-9)c.push([x.v/y.v,`(${x.e}÷${y.e})`]);
    if(Math.abs(x.v)>1e-9)c.push([y.v/x.v,`(${y.e}÷${x.e})`]);
    for(const[v,e]of c){const r=solve([...rest,{v,e}]);if(r)return r}
  }
  return null;
}
const strip=s=>s.startsWith('(')&&s.endsWith(')')?s.slice(1,-1):s;
function fmt(v){
  if(Math.abs(v-Math.round(v))<1e-9)return String(Math.round(v));
  for(let d=2;d<=60;d++)if(Math.abs(v*d-Math.round(v*d))<1e-9)return Math.round(v*d)+'/'+d;
  return v.toFixed(2);
}
function genNums(){let n;do{n=Array.from({length:4},()=>1+Math.floor(Math.random()*10))}while(!solve(n.map(v=>({v,e:String(v)}))));return n}
const solOf=n=>strip(solve(n.map(v=>({v,e:String(v)}))));
const nm=id=>(room&&room.players&&room.players[id]&&room.players[id].name)||'ผู้เล่น';
function resetTiles(){L.tiles=room.nums.map((v,i)=>({id:i,v,e:String(v)}));L.sel=null;L.op=null;L.hist=[]}
function shuf(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

/* ---------- network ---------- */
function setRoom(g){
  room=g;room.recvAt=Date.now();
  const k=g.round+'-'+g.attempt+'-'+g.active+'-'+g.qn+'-'+g.mode;
  if(k!==keySeen){keySeen=k;L.msg='';L.cls='';L.pick=null;if(g.nums&&g.nums.length)resetTiles()}
  render();
}
function broadcast(){
  G.left=(G.mode==='g24'?G.active:G.phase)?G.deadline-Date.now():0;
  const snap=JSON.parse(JSON.stringify(G));
  conns.forEach(c=>{if(c.open)c.send({t:'state',g:snap})});
  setRoom(snap);
  if(isHost)store.set('g24_host',{code,G,QS,A,t:Date.now()});
}
function act(m){if(isHost)hostApply('host',m);else if(hostConn&&hostConn.open)hostConn.send(m)}

function freshG(){return{host:'host',mode:'g24',status:'lobby',target:5,round:0,attempt:0,nums:[],active:null,deadline:0,locked:[],roundDone:false,sol:'',solver:null,winner:null,
  phase:'',qn:0,qtotal:0,q:null,answered:{},rv:null,players:{host:{name:myName,online:true}},scores:{host:0}}}
function createRoom(){
  myName=document.getElementById('nm').value.trim()||'ผู้เล่น';
  code=Array.from({length:4},()=>'ABCDEFGHJKLMNPQRSTUVWXYZ'[Math.floor(Math.random()*24)]).join('');
  err='กำลังสร้างห้อง…';render();
  hostPeer(freshG(),[],{},false,0);
}
function resumeHost(){
  const sv=store.get('g24_host');if(!sv||!sv.G)return;
  code=sv.code;const g=sv.G;myName=(g.players.host||{}).name||'ผู้เล่น';
  Object.keys(g.players).forEach(i=>g.players[i].online=(i==='host'));
  if(g.status==='play'){
    if(g.mode==='g24'){g.active=null;g.attempt++}
    else g.deadline=Date.now()+(g.phase==='reveal'?4000:(g.qtime||15)*1000);
  }
  err='กำลังเปิดห้องเดิม…';render();
  hostPeer(g,sv.QS||[],sv.A||{},true,0);
}
function hostPeer(g0,qs0,a0,resume,tries){
  leaving=false;
  const me=peer=new Peer('g24-'+code);
  me.on('open',()=>{
    isHost=true;uid='host';err='';G=g0;QS=qs0;A=a0;
    if(G.players.host)G.players.host.name=myName;
    broadcast();
  });
  me.on('connection',c=>{
    conns.push(c);
    c.on('data',m=>{
      if(m.t==='join'){
        let p=String(m.pid||'').slice(0,24);if(!p||p==='host')return;
        const nx=String(m.name||'ผู้เล่น').slice(0,12);
        if(!G.players[p]){
          const old=Object.keys(G.players).find(i=>i!=='host'&&G.players[i].online===false&&G.players[i].name===nx);
          if(old){p=old;if(c.open)c.send({t:'adopt',pid:old})}
        }
        peerPid[c.peer]=p;hostApply(p,m);
      }else if(peerPid[c.peer])hostApply(peerPid[c.peer],m);
    });
    c.on('close',()=>{
      conns=conns.filter(x=>x!==c);
      const p=peerPid[c.peer];
      if(p&&!conns.some(x=>x.open&&peerPid[x.peer]===p))dropPlayer(p);
    });
  });
  me.on('error',e=>{
    if(peer!==me)return;
    if(e.type==='unavailable-id'){
      me.destroy();
      if(!resume)createRoom();
      else if(tries<20){err='ห้องเดิมยังไม่ว่าง รอสักครู่… ('+(tries+1)+')';render();setTimeout(()=>hostPeer(g0,qs0,a0,true,tries+1),3000)}
      else{err='เปิดห้องเดิมไม่สำเร็จ ลองใหม่อีกครั้งภายหลัง';peer=null;render()}
    }else{err='เชื่อมต่อไม่ได้ ('+e.type+')';room=null;render()}
  });
}
function joinRoom(){
  myName=document.getElementById('nm').value.trim()||'ผู้เล่น';
  code=document.getElementById('cd').value.trim().toUpperCase();
  if(code.length!==4){err='ใส่รหัสห้อง 4 ตัวอักษร';render();return}
  connectHost(false);
}
function rejoin(){const s=store.get('g24_sess');if(!s)return;code=s.code;myName=s.name||'ผู้เล่น';connectHost(false)}
function connectHost(re){
  leaving=false;
  if(!re){err='กำลังเข้าห้อง…';render()}
  hostConn=null;
  if(peer){const o=peer;peer=null;try{o.destroy()}catch(e){}}
  const me=peer=new Peer();
  me.on('open',()=>{
    uid=pid;
    const hc=me.connect('g24-'+code,{reliable:true});hostConn=hc;
    hc.on('open',()=>{err='';reconnecting=false;reTries=0;store.set('g24_sess',{code,name:myName,t:Date.now()});hc.send({t:'join',name:myName,pid})});
    hc.on('data',m=>{
      if(m.t==='adopt'){pid=m.pid;uid=pid;store.set('g24_pid',pid)}
      else if(m.t==='state')setRoom(m.g);
    });
    hc.on('close',()=>{if(hostConn===hc)lost()});
  });
  me.on('error',e=>{
    if(peer!==me)return;
    if(room){lost();return}
    err=e.type==='peer-unavailable'?'ไม่พบห้อง '+code:'เชื่อมต่อไม่ได้ ('+e.type+')';render();
  });
}
function lost(){
  if(leaving||isHost)return;
  if(!room){err='เชื่อมต่อไม่สำเร็จ';render();return}
  reconnecting=true;render();
  clearTimeout(reTimer);
  reTimer=setTimeout(()=>{
    if(reTries++<40)connectHost(true);
    else{reconnecting=false;cleanup();err='เชื่อมต่อใหม่ไม่สำเร็จ (เจ้าห้องอาจออกไปแล้ว)';render()}
  },2500);
}
document.addEventListener('visibilitychange',()=>{
  if(document.visibilityState==='visible'&&room&&!isHost&&!leaving&&(!hostConn||!hostConn.open)){clearTimeout(reTimer);reconnecting=true;render();connectHost(true)}
});
function cleanup(){const o=peer;peer=null;hostConn=null;conns=[];G=null;room=null;isHost=false;keySeen='';peerPid={};if(o)try{o.destroy()}catch(e){}}
function leave(){leaving=true;clearTimeout(reTimer);reconnecting=false;store.del('g24_host');store.del('g24_sess');cleanup();err='';render()}
function resumeCard(){
  const h=store.get('g24_host'),s=store.get('g24_sess'),n=Date.now(),H=6*3600e3;
  if(h&&h.G&&n-h.t<H)return `<div class="card"><b>🔁 ห้อง ${esc(h.code)} ของคุณยังค้างอยู่</b><div class="sub" style="margin:6px 0 10px">เปิดต่อได้ คะแนนของทุกคนยังอยู่</div><button class="p" style="width:100%" onclick="resumeHost()">เปิดห้องต่อ</button></div>`;
  if(s&&n-s.t<H)return `<div class="card"><b>🔁 กลับเข้าห้อง ${esc(s.code)}</b><div class="sub" style="margin:6px 0 10px">คะแนนเดิมของคุณจะกลับมา</div><button class="p" style="width:100%" onclick="rejoin()">กลับเข้าห้อง</button></div>`;
  return '';
}

/* ---------- host logic ---------- */
function newRound(){G.round++;G.attempt=0;G.nums=genNums();G.active=null;G.locked=[];G.roundDone=false;G.sol='';G.solver=null}
function lock(id){
  G.locked=[...G.locked.filter(x=>x!==id),id];G.active=null;G.attempt++;
  if(onl().every(i=>G.locked.includes(i))){G.roundDone=true;G.sol=solOf(G.nums);G.solver=null}
}
function buildQs(cat){
  const out=[],used=new Set();
  for(let i=0;i<20;i++){
    let k=null;
    const key=c=>c[0]+'|'+[...c.slice(1)].sort().join('|');
    for(let t=0;t<60&&!k;t++){const c=makeQ(cat,i);if(!used.has(key(c))&&(!SEEN.has(key(c))||t>40))k=c}
    if(!k)k=makeQ(cat,i);
    used.add(key(k));SEEN.add(key(k));out.push(k);
  }
  if(SEEN.size>800)SEEN.clear();
  return out.map(([q,r,...w])=>{const o=shuf([r,...w]);return{q,o,c:o.indexOf(r)}});
}
function askQ(){const k=QS[G.qn];G.q={q:k.q,o:k.o};G.phase='ask';G.qtime=G.mode==='math'?45:15;G.deadline=Date.now()+G.qtime*1000;G.answered={};G.rv=null;A={}}
function qReveal(){
  G.phase='reveal';const k=QS[G.qn],picks={},gain={};
  Object.keys(G.players).forEach(id=>{const a=A[id];if(a){picks[id]=a.i;if(a.i===k.c){gain[id]=a.pts;G.scores[id]=(G.scores[id]||0)+a.pts}}});
  G.rv={c:k.c,picks,gain};G.deadline=Date.now()+4000;
}
function nextQ(){G.qn++;if(G.qn>=QS.length){G.status='qend';G.phase='';G.deadline=0;return}askQ()}
const onl=()=>Object.keys(G.players).filter(i=>G.players[i].online!==false);
function allAnswered(){const ids=onl();return ids.length>0&&ids.every(i=>G.answered[i])}
function dropPlayer(id){
  if(!G||!G.players[id]||id==='host')return;
  G.players[id].online=false;
  if(G.mode==='g24'){if(G.active===id){G.active=null;G.attempt++}}
  else if(G.status==='play'&&G.phase==='ask'&&allAnswered())qReveal();
  broadcast();
}
function hostApply(from,m){
  const g=G,play=g.status==='play';
  if(m.t==='join'){g.players[from]={name:String(m.name||'ผู้เล่น').slice(0,12),online:true};g.scores[from]=g.scores[from]||0}
  else if(m.t==='kick'&&from==='host'){const q=m.pid;if(q&&q!=='host'&&g.players[q]&&g.players[q].online===false){delete g.players[q];delete g.scores[q];g.locked=g.locked.filter(x=>x!==q);delete A[q];delete g.answered[q]}}
  else if(m.t==='cfg'&&from==='host'){if(MODES[m.mode])g.mode=m.mode;g.target=+m.target||5}
  else if(m.t==='claim'){if(play&&g.mode==='g24'&&!g.active&&!g.roundDone&&!g.locked.includes(from)){g.active=from;g.deadline=Date.now()+30000}}
  else if(m.t==='giveup'){if(g.active===from)lock(from)}
  else if(m.t==='solved'){if(g.active===from){g.scores[from]++;g.roundDone=true;g.sol=String(m.expr).slice(0,80);g.solver=from;g.active=null;if(g.scores[from]>=g.target){g.status='win';g.winner=from}}}
  else if(m.t==='reveal'){if(play&&g.mode==='g24'&&!g.active&&!g.roundDone){g.roundDone=true;g.sol=solOf(g.nums);g.solver=null}}
  else if(m.t==='next'){if(play&&g.mode==='g24'&&g.roundDone)newRound()}
  else if(m.t==='ans'){
    if(play&&g.mode!=='g24'&&g.phase==='ask'&&g.players[from]&&!A[from]&&m.i>=0&&m.i<4){
      A[from]={i:m.i|0,pts:500+Math.round(500*Math.max(0,g.deadline-Date.now())/((g.qtime||15)*1000))};
      g.answered[from]=true;if(allAnswered())qReveal();
    }
  }
  else if(m.t==='start'&&from==='host'){
    Object.keys(g.players).forEach(i=>g.scores[i]=0);g.winner=null;g.status='play';
    if(g.mode==='g24'){g.round=0;newRound()}
    else{g.round=1;QS=buildQs(g.mode);g.qn=0;g.qtotal=QS.length;askQ()}
  }
  else if(m.t==='lobby'&&from==='host'){g.status='lobby';g.active=null;g.phase=''}
  broadcast();
}
setInterval(()=>{
  if(isHost&&G&&G.status==='play'){
    if(G.mode==='g24'){if(G.active&&Date.now()>G.deadline){lock(G.active);broadcast();return}}
    else if(Date.now()>G.deadline){if(G.phase==='ask')qReveal();else nextQ();broadcast();return}
  }
  if(room&&(room.active||room.phase)){const e=document.getElementById('tm');if(e)e.textContent=leftSec()}
},500);
const leftSec=()=>Math.max(Math.ceil((room.left-(Date.now()-room.recvAt))/1000),0);

/* ---------- play ---------- */
function tapTile(id){
  if(room.active!==uid)return;
  if(L.sel===null||!L.op){L.sel=L.sel===id?null:id;if(L.sel===null)L.op=null;render();return}
  if(L.sel===id){L.sel=null;L.op=null;render();return}
  const a=L.tiles.find(t=>t.id==L.sel),b=L.tiles.find(t=>t.id==id);
  if(L.op=='/'&&Math.abs(b.v)<1e-9){L.msg='หารด้วย 0 ไม่ได้';L.cls='no';render();return}
  const v=L.op=='+'?a.v+b.v:L.op=='-'?a.v-b.v:L.op=='*'?a.v*b.v:a.v/b.v;
  L.hist.push(L.tiles.slice());
  L.tiles=L.tiles.filter(t=>t.id!=a.id&&t.id!=b.id);
  L.tiles.push({id:L.nid++,v,e:`(${a.e}${SYM[L.op]}${b.e})`});
  L.sel=null;L.op=null;L.msg='';L.cls='';
  if(L.tiles.length==1){
    if(Math.abs(L.tiles[0].v-24)<1e-6){act({t:'solved',expr:strip(L.tiles[0].e)});return}
    L.msg=`ได้ ${fmt(L.tiles[0].v)} ไม่ใช่ 24 ลองเลิกทำ`;L.cls='no';
  }
  render();
}
function undo(){if(L.hist.length){L.tiles=L.hist.pop();L.sel=null;L.op=null;L.msg='';render()}}
function setOp(o){if(L.sel!==null){L.op=L.op==o?null:o;render()}}
function pick(i){if(L.pick!==null)return;L.pick=i;render();act({t:'ans',i})}
function cfg(){act({t:'cfg',mode:document.getElementById('md').value,target:document.getElementById('tg').value})}

/* ---------- ui ---------- */
function render0(){
  if(!room){
    $.innerHTML=`<h1>🎯 เกมออนไลน์</h1><p class="sub">เกม 24 และควิซ เล่นกับเพื่อนคนละเครื่อง ไม่ต้องล็อกอิน</p>
    ${resumeCard()}<div class="card"><b>ชื่อของคุณ</b><input id="nm" maxlength="12" value="${esc(myName)}" placeholder="เช่น มิ้นท์" style="margin-top:8px"></div>
    <button class="p" style="width:100%;font-size:18px" onclick="createRoom()">สร้างห้องใหม่</button>
    <div class="card" style="margin-top:12px"><b>มีรหัสห้องแล้ว?</b><div class="row" style="margin-top:8px"><input id="cd" maxlength="4" placeholder="ABCD" style="text-transform:uppercase"><button onclick="joinRoom()">เข้าห้อง</button></div></div>
    <div class="msg no">${esc(err)}</div>`;
    return;
  }
  const ids=Object.keys(room.players),host=isHost,g24=room.mode==='g24';
  if(room.status==='lobby'){
    $.innerHTML=`<h1>ห้องรอเล่น</h1><p class="sub">ให้เพื่อนเปิดลิงก์นี้แล้วใส่รหัสห้อง</p><div class="code">${esc(code)}</div>
    <div class="card" style="margin-top:12px"><b>ผู้เล่น (${ids.length})</b>${ids.map(i=>`<div style="padding:6px 0">${esc(nm(i))}${i==='host'?' 👑':''}${i===uid?' (คุณ)':''}${room.players[i].online===false?' <span style="color:var(--mut)">· หลุด</span>'+(host?` <button onclick="act({t:'kick',pid:'${i}'})" style="padding:2px 8px;font-size:12px">ลบ</button>`:''):''}</div>`).join('')}</div>
    ${host?`<div class="card"><b>เลือกโหมด</b><select id="md" onchange="cfg()" style="margin:8px 0 12px">${Object.keys(MODES).map(k=>`<option value="${k}"${k===room.mode?' selected':''}>${MODES[k]}</option>`).join('')}</select>
    ${g24?`<b>เล่นถึงกี่คะแนน</b><select id="tg" onchange="cfg()" style="margin-top:8px">${[3,5,7,10].map(n=>`<option value="${n}"${n==room.target?' selected':''}>${n} คะแนน</option>`).join('')}</select>`:`<input type="hidden" id="tg" value="${room.target}"><div class="sub" style="margin:0">20 ข้อ · ${room.mode==='math'?45:15} วินาทีต่อข้อ · ตอบถูกและเร็วได้แต้มมาก</div>`}</div>
    <button class="p" style="width:100%;font-size:18px" onclick="act({t:'start'})">เริ่มเกม</button>`:`<div class="card"><b>โหมด:</b> ${MODES[room.mode]}</div><p class="sub">รอเจ้าห้องกดเริ่มเกม…</p>`}
    <button style="width:100%;margin-top:12px" onclick="leave()">ออกจากห้อง</button>`;
    return;
  }
  const quizOn=i=>room.phase==='ask'&&room.answered&&room.answered[i];
  const sc=`<div class="sc">${ids.map(i=>`<div class="chip${(g24?room.active===i:quizOn(i))?' on':''}${(g24&&room.locked.includes(i))||room.players[i].online===false?' lk':''}">${esc(nm(i))}${i===uid?' ★':''}${room.players[i].online===false?' 💤':''}<b>${room.scores[i]||0}</b></div>`).join('')}</div>`;
  if(room.status==='win'||room.status==='qend'){
    let body;
    if(room.status==='win')body=`<div class="big">🏆</div><h1>${esc(nm(room.winner))} ชนะ!</h1><div style="margin-top:16px">${sc}</div>`;
    else{
      const rk=ids.slice().sort((a,b)=>(room.scores[b]||0)-(room.scores[a]||0));
      body=`<div class="big">🏆</div><h1>จบเกม! ${MODES[room.mode]}</h1><div style="margin:16px 0">${rk.map((i,n)=>`<div class="rk"><span>${['🥇','🥈','🥉'][n]||(n+1)+'.'} ${esc(nm(i))}${i===uid?' ★':''}</span><b>${room.scores[i]||0}</b></div>`).join('')}</div>`;
    }
    $.innerHTML=`<div class="card" style="margin-top:30px">${body}
    ${host?`<button class="p" style="width:100%" onclick="act({t:'lobby'})">เล่นอีกครั้ง / เปลี่ยนโหมด</button>`:'<p class="sub">รอเจ้าห้องเริ่มเกมใหม่…</p>'}
    <button style="width:100%;margin-top:8px" onclick="leave()">ออกจากห้อง</button></div>`;
    return;
  }
  if(!g24){
    const q=room.q,rv=room.rv;
    let st;
    if(rv){const gn=rv.gain[uid];st=gn?`✅ ถูก! +${gn} คะแนน`:(rv.picks[uid]===undefined?'⏱ ไม่ได้ตอบ':'❌ ตอบผิด');}
    else st=(L.pick!==null||room.answered[uid])?`ส่งคำตอบแล้ว รอเพื่อน… (${Object.keys(room.answered).length}/${ids.length})`:`ตอบแล้ว ${Object.keys(room.answered).length}/${ids.length} คน`;
    $.innerHTML=`<h1>${MODES[room.mode]}</h1><p class="sub">ข้อ ${room.qn+1} / ${room.qtotal}${rv?' · เฉลย':''}</p>${sc}
    <div class="msg">${rv?'เฉลยแล้ว ข้อต่อไปกำลังมา…':`เหลือ <span class="timer" id="tm">${leftSec()}</span> วิ`}</div>
    <div class="card"><b style="font-size:18px;line-height:1.5">${esc(q.q)}</b></div>
    ${q.o.map((t,i)=>{let c='';if(rv){if(i===rv.c)c='good';else if(rv.picks[uid]===i)c='bad'}else if(L.pick===i)c='sel';return `<button class="opt ${c}" ${rv||L.pick!==null||room.answered[uid]?'disabled':''} onclick="pick(${i})">${esc(t)}</button>`}).join('')}
    <div class="msg ${rv&&rv.gain[uid]?'ok':''}">${st}</div>
    <button style="width:100%;margin-top:8px;font-size:13px;color:var(--mut)" onclick="leave()">ออกจากห้อง</button>`;
    return;
  }
  const mine=room.active===uid;
  const nums=mine?L.tiles:room.nums.map((v,i)=>({id:i,v}));
  const tiles=`<div class="tiles">${nums.map(t=>`<button class="tile${L.sel===t.id&&mine?' sel':''}" ${mine?'':'disabled'} onclick="tapTile(${t.id})">${fmt(t.v)}</button>`).join('')}</div>`;
  const ops=`<div class="ops">${['+','-','*','/'].map(o=>`<button class="op${L.op==o?' sel':''}" ${mine&&L.sel!==null?'':'disabled'} onclick="setOp('${o}')">${SYM[o]}</button>`).join('')}</div>`;
  let head='',msg=L.msg,cls=L.cls,ctl='';
  if(room.roundDone){
    msg=room.solver?`🎉 ${nm(room.solver)} ได้ 24: ${room.sol}`:`เฉลย: ${room.sol} = 24`;cls=room.solver?'ok':'';
    ctl=`<button class="p" style="width:100%" onclick="act({t:'next'})">รอบถัดไป</button>`;
  }else if(room.active){
    head=`<div class="msg">ตาของ ${esc(nm(room.active))}${mine?' (คุณ)':''} · เหลือ <span class="timer" id="tm">${leftSec()}</span> วิ</div>`;
    ctl=mine?`<div class="row"><button style="flex:1" onclick="undo()">↶ เลิกทำ</button><button style="flex:1" onclick="resetTiles();L.msg='';render()">เริ่มใหม่</button><button style="flex:1" onclick="act({t:'giveup'})">ยอมแพ้</button></div>`:'';
  }else{
    const lk=room.locked.includes(uid);
    msg=lk?'คุณหมดสิทธิ์รอบนี้ รอเพื่อนลอง':(room.locked.length?'เปิดให้คนอื่นลองต่อ!':'ใครเห็นคำตอบก่อน กดปุ่มเลย!');
    ctl=`<button class="p" style="width:100%;font-size:20px" ${lk?'disabled':''} onclick="act({t:'claim'})">✋ ฉันแก้ได้!</button><button style="width:100%;margin-top:8px" onclick="act({t:'reveal'})">ไม่มีใครแก้ได้ ดูเฉลย</button>`;
  }
  $.innerHTML=`<h1>🎯 เกม 24</h1><p class="sub">ห้อง ${esc(code)} · ถึง ${room.target} คะแนนชนะ · รอบที่ ${room.round}</p>${sc}${head}${tiles}${ops}<div class="msg ${cls}">${esc(msg)}</div>${ctl}
  <button style="width:100%;margin-top:8px;font-size:13px;color:var(--mut)" onclick="leave()">ออกจากห้อง</button>`;
}
function render(){render0();if(reconnecting&&room)$.insertAdjacentHTML('afterbegin','<div class="msg no">⚠️ หลุดการเชื่อมต่อ กำลังเชื่อมต่อใหม่… (คะแนนของคุณยังอยู่)</div>')}
render();
</script>
</body>
</html>
